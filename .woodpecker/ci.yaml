# The Maschine MK1/MK3 controller tool. midir talks to ALSA, so the build needs libasound2-dev — the
# same thing the repo's own Dockerfile.gnu installs.
steps:
  - name: check
    image: docker.io/library/rust:1.99.1
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends libasound2-dev >/dev/null
      # `cargo fmt --check` fails closed on this image: rust:1.99.1 ships without the rustfmt
      # component (measured: `cargo fmt --version` -> "error: 'cargo-fmt' is not installed for the
      # toolchain '1.99.1'"), and unlike the wasm benches there is no rust-toolchain.toml here to
      # pull it in. The 1.97.1 benches do have one, which is why their fmt passes.
      - rustup component add rustfmt
      - cargo fmt --check
      - cargo build --release
      - cargo test

when:
  - event: push
    branch: master
  - event: pull_request
